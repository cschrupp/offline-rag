[project]
name = "offline-rag"
version = "0.1.0"
description = "An evaluated, fully local RAG platform for private technical knowledge."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "pydantic",
    "pyyaml",
]

[project.scripts]
offline-rag = "offline_rag.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/offline_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py314"
src = ["src", "tests"]
