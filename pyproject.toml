[project]
name = "offline-rag"
version = "0.1.0"
description = "An evaluated, fully local RAG platform for private technical knowledge."
readme = "README.md"
authors = [
    { name = "Carlos A. Schrupp", email = "carlos.schrupp@berkeley.edu" },
]
requires-python = ">=3.14,<3.15"
dependencies = [
    "docling>=2.126.0",
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    # transformers 4.x (required for Optimum ONNX) needs huggingface-hub <1.
    "huggingface-hub>=0.34.0,<1",
    "pydantic",
    "python-multipart>=0.0.9",
    "pyyaml",
    "qdrant-client>=1.12.0",
    "sentence-transformers>=2.7.0",
    "tiktoken",
    # cpu_onnx_fp32_v1: Transformers 5.x breaks Optimum ONNX (get_parameter_dtype).
    # Ceiling matches accepted 16K-D CPU-ONNX feasibility environment (4.57.6).
    "transformers>=4.51.0,<5",
    "onnxruntime>=1.19.0",
    "optimum>=1.23.0,<2.2",
    "optimum-onnx>=0.1.0",
    "uvicorn>=0.35.0",
]

[project.scripts]
offline-rag = "offline_rag.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/offline_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: heavier integration tests (still required for Slice 1 CI)",
]

[tool.ruff]
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/offline_rag/cli.py" = ["BLE001"]
"src/offline_rag/ingestion/pipeline.py" = ["BLE001"]
"src/offline_rag/app/ingest_upload.py" = ["BLE001"]
"src/offline_rag/app/ingest.py" = ["BLE001"]
"src/offline_rag/chunking/pipeline.py" = ["BLE001"]
"src/offline_rag/dense/pipeline.py" = ["BLE001"]
"src/offline_rag/dense/evaluate.py" = ["BLE001"]
"src/offline_rag/dense/provision.py" = ["BLE001"]
"src/offline_rag/rerank/provision.py" = ["BLE001"]
"scripts/*" = ["T20"]

