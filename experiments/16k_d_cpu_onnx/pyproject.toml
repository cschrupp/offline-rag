[project]
name = "seneca-16k-d-cpu-onnx-feasibility"
version = "0.0.0"
description = "Isolated dependency environment for 16K-D CPU-ONNX-01 (not production)."
requires-python = ">=3.14,<3.15"
dependencies = [
    # Feasibility-only; must not be promoted into Seneca production pyproject.
    "sentence-transformers>=2.7.0",
    "onnxruntime>=1.19.0",
    "onnx>=1.16.0",
    # Optimum 2.x split ORT helpers into optimum-onnx (required by ST quantize).
    "optimum>=1.23.0,<2.2",
    "optimum-onnx>=0.1.0",
    # transformers 5.x may break optimum ONNX paths; pin 4.x like OV env.
    "transformers>=4.51.0,<5",
    "numpy",
    "torch",
]

[dependency-groups]
dev = [
    "pytest",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.uv]
package = false
