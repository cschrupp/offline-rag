project:
  name: offline-rag
  strict_offline: true

paths:
  # Local/dev defaults are repo-relative. Containers should override via
  # OFFLINE_RAG_DATA_DIR / OFFLINE_RAG_MODELS_DIR (or an overlay YAML).
  raw_data: data/raw
  manifests: data/manifests
  processed: data/processed
  corpora: data/corpora
  chunks: data/chunks
  chunk_manifests: data/chunk-manifests
  embeddings: data/embeddings
  index_manifests: data/index-manifests
  qdrant_storage: data/qdrant
  retrieval_models: models
  docling_artifacts: models/docling
  tokenizer_artifacts: models/tokenizers/tiktoken
  embedding_artifacts: models/embeddings
  reranker_artifacts: models/rerankers
  eval_results: eval/results

logging:
  level: INFO
  structured: true

deployment:
  profile: standalone_ollama
  qdrant_mode: local

ingestion:
  parser: docling
  chunker: docling_hybrid
  target_tokens: 384
  max_tokens: 512
  preserve_tables: true
  parent_child: true

parsing:
  pdf:
    # Slice 1 defaults to born-digital/layout extraction. OCR is opt-in.
    ocr_enabled: false

chunking:
  strategy: structure_aware
  parent_child: true
  tokenizer:
    implementation: tiktoken
    encoding: cl100k_base
  child:
    target_tokens: 350
    max_tokens: 512
  parent:
    target_tokens: 1200
    max_tokens: 2000

dense:
  enabled: true
  model: Qwen/Qwen3-Embedding-0.6B
  model_path: models/embeddings/qwen3-embedding-0.6b
  local_files_only: true
  top_k: 10

indexing:
  backend: qdrant_local
  backend_contract: qdrant-local-v1
  metric: cosine
  embedding_text:
    strategy: plain
    contract_version: plain-v1
  embedding:
    implementation: sentence_transformers
    model_id: Qwen/Qwen3-Embedding-0.6B
    revision: 97b0c614be4d77ee51c0cef4e5f07c00f9eb65b3
    dimension: 1024
    normalize: true
    adapter_contract: sentence-transformers-v1
    batch_size: 32
    device: cpu

lexical:
  enabled: true
  method: bm25
  top_k: 30
  text:
    strategy: plain
    contract_version: plain-v1
  analyzer:
    strategy: technical
    contract_version: technical-v1
    unicode_normalization: NFKC
    case_normalization: casefold
    stopwords: none
    stemming: none
    lemmatization: none
  bm25:
    contract_version: bm25-okapi-v1
    k1: 1.2
    b: 0.75
    idf: rsj-positive-smoothed-v1
    query_tf: unique-terms-v1

fusion:
  method: rrf
  contract_version: rrf-v1
  rrf_k: 60
  dense_top_k: 30
  lexical_top_k: 30
  output_top_k: 10

reranker:
  enabled: true
  implementation: sentence_transformers
  model:
    model_id: BAAI/bge-reranker-v2-m3
    revision: 953dc6f6f85a1b2dbfca4c34a2796e7dde08d41e
    model_path: models/rerankers/bge-reranker-v2-m3
    adapter_contract: sentence-transformers-cross-encoder-v1
    local_files_only: true
    trust_remote_code: false
  input_k: 30
  output_k: 10
  input_construction: plain-pair-v1
  sequence_contract: seq-trunc-1024-passage-right-v1
  max_length: 1024
  score_transform: raw-logit-v1
  tie_break: chunk-id-asc-v1
  device: auto
  batch_size: 16

context:
  enabled: true
  strategy: parent
  anchor_k: 5
  max_context_tokens: 6000
  neighbor_window: 0

generation:
  enabled: true
  provider: openai_compatible
  base_url: http://host.docker.internal:11434/v1
  model: REPLACE_WITH_APPROVED_LOCAL_MODEL
  temperature: 0.0
  max_output_tokens: 1200
  timeout_seconds: 120
  api_key: null
  approved_endpoints:
    - http://host.docker.internal:11434/v1
  approved_models: []

authoring:
  enabled: false
  provider: openai_compatible
  adapter_contract: openai-compatible-authoring-v1
  base_url: http://127.0.0.1:11434/v1
  model: null
  api_key: null
  network_policy: localhost_only
  approved_endpoints: []
  approved_models: []
  temperature: 0.0
  max_output_tokens: 1200
  timeout_seconds: 120
  contracts:
    question_proposal: question-proposal-v1
    relevance_prelabel: relevance-prelabel-v1
    artifact: offline-rag-gold-authoring-v1

evaluation:
  generation_semantic_judge:
    enabled: false
    provider: openai_compatible
    adapter_contract: openai-compatible-generation-semantic-judge-v1
    base_url: http://127.0.0.1:11434/v1
    model: null
    api_key: null
    network_policy: localhost_only
    approved_endpoints: []
    approved_models: []
    temperature: 0.0
    max_output_tokens: 1200
    timeout_seconds: 120
    prompt_contract: generation-semantic-judge-v1
    output_contract: generation-semantic-judge-output-v1

retrieval_recovery:
  enabled: false
  max_retries: 1

abstention:
  enabled: true
  policy: score_threshold
  threshold: null

security:
  treat_documents_as_untrusted: true
  allow_network_tools: false
  allow_shell_tools: false
  allow_arbitrary_filesystem_tools: false
  validate_citations: true
  reject_unapproved_generation_endpoint: true
  reject_unapproved_generation_model: true
