project:
  name: offline-rag
  strict_offline: true

paths:
  # Local/dev defaults are repo-relative. Containers should override via
  # OFFLINE_RAG_DATA_DIR / OFFLINE_RAG_MODELS_DIR (or an overlay YAML).
  raw_data: data/raw
  manifests: data/manifests
  processed: data/processed
  corpora: data/corpora
  chunks: data/chunks
  chunk_manifests: data/chunk-manifests
  embeddings: data/embeddings
  index_manifests: data/index-manifests
  qdrant_storage: data/qdrant
  retrieval_models: models
  docling_artifacts: models/docling
  tokenizer_artifacts: models/tokenizers/tiktoken
  embedding_artifacts: models/embeddings
  eval_results: eval/results

logging:
  level: INFO
  structured: true

deployment:
  profile: standalone_ollama
  qdrant_mode: local

ingestion:
  parser: docling
  chunker: docling_hybrid
  target_tokens: 384
  max_tokens: 512
  preserve_tables: true
  parent_child: true

parsing:
  pdf:
    # Slice 1 defaults to born-digital/layout extraction. OCR is opt-in.
    ocr_enabled: false

chunking:
  strategy: structure_aware
  parent_child: true
  tokenizer:
    implementation: tiktoken
    encoding: cl100k_base
  child:
    target_tokens: 350
    max_tokens: 512
  parent:
    target_tokens: 1200
    max_tokens: 2000

dense:
  enabled: true
  model: Qwen/Qwen3-Embedding-0.6B
  model_path: models/embeddings/qwen3-embedding-0.6b
  local_files_only: true
  top_k: 10

indexing:
  backend: qdrant_local
  backend_contract: qdrant-local-v1
  metric: cosine
  embedding_text:
    strategy: plain
    contract_version: plain-v1
  embedding:
    implementation: sentence_transformers
    model_id: Qwen/Qwen3-Embedding-0.6B
    revision: 97b0c614be4d77ee51c0cef4e5f07c00f9eb65b3
    dimension: 1024
    normalize: true
    adapter_contract: sentence-transformers-v1
    batch_size: 32
    device: cpu

sparse:
  enabled: true
  method: bm25
  top_k: 30

fusion:
  method: rrf
  rrf_k: 60

reranker:
  enabled: true
  model: REPLACE_WITH_LOCAL_RERANKER
  model_path: /models/reranker/REPLACE_ME
  local_files_only: true
  input_k: 30
  output_k: 6

context:
  strategy: parent
  max_context_tokens: 6000
  neighbor_window: 0

generation:
  provider: openai_compatible
  base_url: http://host.docker.internal:11434/v1
  model: REPLACE_WITH_APPROVED_LOCAL_MODEL
  temperature: 0.0
  max_output_tokens: 1200
  timeout_seconds: 120
  approved_endpoints:
    - http://host.docker.internal:11434/v1
  approved_models: []

retrieval_recovery:
  enabled: false
  max_retries: 1

abstention:
  enabled: true
  policy: score_threshold
  threshold: null

security:
  treat_documents_as_untrusted: true
  allow_network_tools: false
  allow_shell_tools: false
  allow_arbitrary_filesystem_tools: false
  validate_citations: true
  reject_unapproved_generation_endpoint: true
  reject_unapproved_generation_model: true
