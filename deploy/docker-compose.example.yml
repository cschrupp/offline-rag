# Supported Slice 15G standalone profile.
# Ollama / other generators run on the host — NOT as Compose services.
# Qdrant Local persists in-process under /data/qdrant — NOT a server service.
services:
  offline-rag:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      # Loopback-only host publication (D14). Broadening this exposes an
      # unauthenticated Slice-15 API to the network — do not use 8080:8080
      # or 0.0.0.0:8080:8080 unless you intentionally accept that risk.
      - "127.0.0.1:8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    stop_grace_period: 45s
    environment:
      OFFLINE_RAG_CONFIG: "/app/config/base.yaml"
      OFFLINE_RAG_DATA_DIR: "/data"
      OFFLINE_RAG_MODELS_DIR: "/models"
      OFFLINE_RAG_STRICT_OFFLINE: "true"
      OFFLINE_RAG_HTTP_HOST: "0.0.0.0"
      OFFLINE_RAG_HTTP_PORT: "8080"
      OFFLINE_RAG_ALLOW_NON_LOOPBACK: "true"
      OFFLINE_RAG_SHUTDOWN_GRACE_SECONDS: "30"
      OFFLINE_RAG_LLM_BASE_URL: "http://host.docker.internal:11434/v1"
      OFFLINE_RAG_LLM_MODEL: "${OFFLINE_RAG_LLM_MODEL}"
      OFFLINE_RAG_APPROVED_LLM_MODELS: "${OFFLINE_RAG_APPROVED_LLM_MODELS}"
      OFFLINE_RAG_APPROVED_LLM_ENDPOINTS: "http://host.docker.internal:11434/v1"
      # Optional; never bake secrets into the image.
      OFFLINE_RAG_LLM_API_KEY: "${OFFLINE_RAG_LLM_API_KEY:-}"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    volumes:
      - ../data:/data
      - ../models:/models:ro
